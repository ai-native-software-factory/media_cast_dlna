group = "br.com.felnanuke2.media_cast_dlna"
version = "1.0-SNAPSHOT"

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
}

buildscript {
    ext.kotlin_version = "2.1.0"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.7.3")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "br.com.felnanuke2.media_cast_dlna"

    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 26
    }

    dependencies {
        implementation("org.jupnp:org.jupnp.android:3.0.3")
        implementation("org.jupnp:org.jupnp.support:3.0.3")
        implementation("org.eclipse.jetty:jetty-server:9.4.54.v20240208")
        implementation("org.eclipse.jetty:jetty-servlet:9.4.54.v20240208")
        implementation("org.eclipse.jetty:jetty-client:9.4.54.v20240208")
        implementation("org.eclipse.jetty:jetty-http:9.4.54.v20240208")
        implementation("org.eclipse.jetty:jetty-io:9.4.54.v20240208")
        implementation("org.eclipse.jetty:jetty-util:9.4.54.v20240208")
        
        // Kotlin Coroutines
        implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
        implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3")

        compileOnly files("$flutterRoot/bin/cache/artifacts/engine/android-arm/flutter.jar")

        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.0.0")

        // The plugin talks to Flutter through io.flutter.plugin.common.* classes. Those are only
        // compileOnly for the main source set, so unit tests need the engine jar on their own
        // classpath to compile and to load Pigeon/BinaryMessenger types at runtime.
        testImplementation files("$flutterRoot/bin/cache/artifacts/engine/android-arm/flutter.jar")

        // Robolectric (JUnit4) drives the registry listener tests: UpnpRegistryListener builds an
        // Android Handler and posts every Flutter callback to the main looper. The JUnit Vintage
        // engine lets these JUnit4/Robolectric tests run under the JUnit Platform configured below.
        testImplementation("junit:junit:4.13.2")
        testImplementation("org.robolectric:robolectric:4.14.1")
        testImplementation("org.junit.vintage:junit-vintage-engine:5.11.4")
    }

    testOptions {
        unitTests {
            // Required for Robolectric to resolve the merged manifest/resources.
            includeAndroidResources = true

            all {
                useJUnitPlatform()

                testLogging {
                   events "passed", "skipped", "failed", "standardOut", "standardError"
                   outputs.upToDateWhen {false}
                   showStandardStreams = true
                }
            }
        }
    }
}
